name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your BYD password, your PIN or your VIN: the logs of the integration do not contain them, but check before posting.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → BYD, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car model and country of the account
      description: The model shown by "Test the connection", electric or plug-in hybrid, and the country set in the configuration.
      placeholder: 'ATTO 3, electric, FR'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). For a missing or wrong value, click Diagnostic in the configuration and copy the lines starting with "BYD diagnostic" (anonymized). In developer mode, the environment variable `DEBUG=gladys-integration-sdk` adds the SDK debug logs.
      render: text
