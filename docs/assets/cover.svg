<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the BYD integration for Gladys Assistant. An illustration
       with the brand name in plain text: never the BYD logo, a trademark
       of BYD Company Ltd. Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <radialGradient id="sky" cx="400" cy="330" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4f7e"/>
      <stop offset="0.55" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#070f1c"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14304f"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fb3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4fb3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6cc4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ad8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6cc4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e4ebf3"/>
      <stop offset="0.62" stop-color="#b7c5d6"/>
      <stop offset="1" stop-color="#6f8299"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4d74"/>
      <stop offset="0.5" stop-color="#0f1f33"/>
      <stop offset="1" stop-color="#1c3756"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset="0.6" stop-color="#9aa7b8"/>
      <stop offset="1" stop-color="#4b5869"/>
    </radialGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="paint" x1="0" y1="250" x2="0" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="0.38" stop-color="#e3e9f0"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9eabbd"/>
      <stop offset="0.58" stop-color="#d5dde7"/>
      <stop offset="0.8" stop-color="#a3b0c1"/>
      <stop offset="1" stop-color="#46546a"/>
    </linearGradient>
    <linearGradient id="dlo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1726"/>
      <stop offset="0.55" stop-color="#1b324e"/>
      <stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <linearGradient id="tyre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a313c"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <clipPath id="bodyclip"><use href="#bodyshape"/></clipPath>
    <path id="bodyshape" d="M690 400 Q704 392 702 376 Q701 362 686 353 Q608 334 528 318
             C492 290 460 272 420 265 Q362 256 300 267 C252 277 206 299 168 315
             Q146 320 139 330 C128 346 126 374 130 392 L134 402 L177 402 A48 48 0 0 1 273 402
             L542 402 A48 48 0 0 1 638 402 Z"/>
    <g id="wheel">
      <circle r="44" fill="url(#tyre)"/>
      <circle r="35" fill="#11161e"/>
      <circle r="33" fill="url(#rim)"/>
      <g fill="#1a2230">
        <path id="spoke" d="M-2 -10 Q-9 -20 -6 -31 L0 -32 Q-2 -20 3 -10 Z"/>
        <use href="#spoke" transform="rotate(36)"/><use href="#spoke" transform="rotate(72)"/>
        <use href="#spoke" transform="rotate(108)"/><use href="#spoke" transform="rotate(144)"/>
        <use href="#spoke" transform="rotate(180)"/><use href="#spoke" transform="rotate(216)"/>
        <use href="#spoke" transform="rotate(252)"/><use href="#spoke" transform="rotate(288)"/>
        <use href="#spoke" transform="rotate(324)"/>
      </g>
      <circle r="33" fill="none" stroke="#e8edf3" stroke-width="1.5" opacity="0.8"/>
      <circle r="10" fill="#6b788a"/>
      <circle r="5" fill="#d3dae4"/>
    </g>
  </defs>

  <!-- backdrop: studio glow, floor with perspective lines -->
  <rect width="800" height="534" fill="url(#sky)"/>
  <rect y="446" width="800" height="88" fill="url(#floor)"/>
  <g stroke="#5aa9e6" stroke-opacity="0.13" stroke-width="1" fill="none">
    <path d="M400 446 L-200 534 M400 446 L0 534 M400 446 L200 534 M400 446 L400 534
             M400 446 L600 534 M400 446 L800 534 M400 446 L1000 534"/>
    <path d="M0 462 H800 M0 484 H800 M0 512 H800"/>
  </g>
  <ellipse cx="420" cy="452" rx="330" ry="34" fill="url(#pool)"/>
  <rect x="40" y="445" width="720" height="2" fill="url(#horizon)"/>

  <!-- title -->
  <text x="400" y="98" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif"
        font-size="74" font-weight="800" letter-spacing="22" fill="#ffffff">BYD</text>
  <rect x="370" y="118" width="60" height="3" rx="1.5" fill="#4fb3ff"/>
  <text x="400" y="152" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif"
        font-size="23" font-weight="500" letter-spacing="1" fill="#a9c8e8">for Gladys Assistant</text>

  <!-- the car: a low electric fastback, facing right (proportions of a
       4.8 m long, 1.46 m high car with a 2.92 m wheelbase) -->
  <g id="car">
    <path d="M177 402 A48 48 0 0 1 273 402 Z M542 402 A48 48 0 0 1 638 402 Z" fill="#04070c"/>
    <use href="#bodyshape" fill="url(#paint)"/>
    <g clip-path="url(#bodyclip)">
      <!-- rocker in the shade, lower sculpture rising to the rear -->
      <path d="M268 404 L548 404 L546 384 Q420 380 278 388 Z" fill="#2b384a" opacity="0.85"/>
      <path d="M140 372 C230 372 300 360 420 356 C520 352 600 350 700 352 L700 340 C600 338 500 340 420 344 C300 348 220 356 140 356 Z"
            fill="#ffffff" opacity="0.18"/>
      <!-- front intake and diffuser -->
      <path d="M672 394 Q694 390 704 380 L704 404 L668 404 Z" fill="#141b26"/>
      <path d="M128 386 Q150 390 176 390 L176 404 L128 404 Z" fill="#141b26"/>
    </g>
    <!-- side glass with its black surround and pillars -->
    <path d="M509 318 C480 296 452 282 420 276 Q362 267 306 277 C264 286 226 302 196 316
             Q194 325 202 325 L500 328 Q512 328 509 318 Z" fill="#0b1320"/>
    <path d="M500 318 C476 298 450 286 420 281 Q394 277 380 277 L375 327 Z" fill="url(#dlo)"/>
    <path d="M364 277 Q332 277 308 282 C272 290 240 304 214 321 L358 326 Z" fill="url(#dlo)"/>
    <path d="M420 281 Q440 286 452 292 L394 327 L378 327 Z" fill="#ffffff" opacity="0.07"/>
    <path d="M509 318 C480 296 452 282 420 276 Q362 267 306 277 C264 286 226 302 196 316"
          fill="none" stroke="#c9d3df" stroke-width="1.5" opacity="0.7"/>
    <!-- mirror -->
    <path d="M500 322 Q494 306 506 304 Q522 303 524 314 Q525 320 514 321 Z" fill="#dfe6ee"/>
    <path d="M504 321 Q500 312 508 309 L520 310 Q522 318 514 321 Z" fill="#0f1724"/>
    <!-- shoulder highlight, door seams, flush handles -->
    <path d="M168 330 C300 327 470 328 600 338" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <path d="M372 328 L367 392 M518 326 Q522 352 532 368 M262 320 Q270 340 268 360"
          fill="none" stroke="#5f6f84" stroke-width="1.2" opacity="0.8"/>
    <rect x="322" y="336" width="28" height="3.5" rx="1.75" fill="#7b8ba0"/>
    <rect x="456" y="336" width="28" height="3.5" rx="1.75" fill="#7b8ba0"/>
    <!-- light strips, with their glow -->
    <path d="M648 342 Q680 348 698 362" fill="none" stroke="#bfe6ff" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M648 342 Q680 348 698 362" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M136 338 Q146 326 176 318" fill="none" stroke="#ff3b5c" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M136 338 Q146 326 176 318" fill="none" stroke="#ff8096" stroke-width="2.5" stroke-linecap="round"/>
    <!-- charging port, glowing green -->
    <circle cx="206" cy="336" r="7" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="206" cy="336" r="3.5" fill="#bbf7d0"/>
    <use href="#wheel" x="225" y="402"/>
    <use href="#wheel" x="590" y="402"/>
  </g>
  <ellipse cx="408" cy="447" rx="300" ry="7" fill="#02060c" opacity="0.9" filter="url(#glow)"/>
  <!-- what the integration reads: status chips, linked to the car -->
  <g stroke="#7cc4ff" stroke-opacity="0.45" stroke-width="1.5" fill="none" stroke-dasharray="3 5">
    <path d="M150 214 L150 280 L202 332"/>
    <path d="M650 214 L650 262 L520 306"/>
  </g>
  <g font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <!-- battery, charging -->
    <g transform="translate(64 172)">
      <rect width="172" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <rect x="18" y="14" width="34" height="16" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="52" y="19" width="3" height="6" rx="1" fill="#ffffff"/>
      <rect x="21" y="17" width="23" height="10" rx="2" fill="url(#charge)"/>
      <text x="68" y="29">80 %</text>
      <path d="M150 12 L140 24 H147 L143 33 L154 20 H147 Z" fill="#facc15"/>
    </g>
    <!-- climate -->
    <g transform="translate(570 172)">
      <rect width="160" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <g transform="translate(34 22)" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M0 -11 V11 M-9.5 -5.5 L9.5 5.5 M-9.5 5.5 L9.5 -5.5"/>
        <path d="M-3 -9 L0 -6 L3 -9 M-3 9 L0 6 L3 9"/>
      </g>
      <text x="58" y="29">21 °C</text>
    </g>
    <!-- range -->
    <g transform="translate(64 112)">
      <rect width="148" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <path d="M30 11 C22 11 18 17 18 22 C18 29 30 36 30 36 C30 36 42 29 42 22 C42 17 38 11 30 11 Z" fill="#4fb3ff"/>
      <circle cx="30" cy="22" r="4" fill="#0f2742"/>
      <text x="54" y="29">412 km</text>
    </g>
    <!-- locked -->
    <g transform="translate(626 112)">
      <rect width="104" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <path d="M24 20 V16 A8 8 0 0 1 40 16 V20" fill="none" stroke="#ffffff" stroke-width="2.4"/>
      <rect x="20" y="20" width="24" height="16" rx="4" fill="#ffffff"/>
      <circle cx="32" cy="28" r="2.5" fill="#0f2742"/>
      <path d="M58 22 L65 29 L80 14" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
